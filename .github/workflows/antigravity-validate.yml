name: antigravity-validate

on:
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: antigravity-validate-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

env:
  # Garante que as JavaScript actions já rodem no runtime Node 24.
  # Mantém o Node do projeto controlado em actions/setup-node abaixo.
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  validate:
    name: Validate repository
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    env:
      CI: true
      VITE_SUPABASE_URL: ${{ vars.CI_SUPABASE_URL || 'https://example.supabase.co' }}
      VITE_SUPABASE_ANON_KEY: ${{ vars.CI_SUPABASE_ANON_KEY || 'example-anon-key' }}
      VITE_SUPABASE_FUNCTIONS_URL: ${{ vars.CI_SUPABASE_FUNCTIONS_URL || 'https://example.supabase.co/functions/v1' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --prefer-offline
      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v3
        with:
          version: 2.72.7

      - name: Start disposable Supabase
        run: |
          set -euo pipefail
          cli_state="$RUNNER_TEMP/rebanhosync-supabase-cli-latest"
          if [[ -f supabase/.temp/cli-latest ]]; then
            cp supabase/.temp/cli-latest "$cli_state"
          else
            rm -f "$cli_state"
          fi
          supabase init --force
          supabase start
          supabase db reset --yes

      - name: Export local Supabase test environment
        run: |
          set -euo pipefail
          env_file="$RUNNER_TEMP/rebanhosync-supabase.env"
          supabase status -o env > "$env_file"
          set -a
          source "$env_file"
          set +a
          {
            echo "REBANHOSYNC_TEST_DB_URL=$DB_URL"
            echo "REBANHOSYNC_TEST_API_URL=$API_URL"
            echo "REBANHOSYNC_TEST_SERVICE_ROLE_KEY=$SERVICE_ROLE_KEY"
          } >> "$GITHUB_ENV"

      - name: Prepare commercial concurrency fixture
        run: node scripts/ci/prepare-commercial-concurrency-fixture.mjs

      - name: Lint
        run: pnpm run lint

      - name: Test
        timeout-minutes: 20
        run: pnpm exec vitest run --bail=1 --maxWorkers=50% --testTimeout=15000 --reporter=verbose

      - name: Build
        run: pnpm run build
      - name: Stop disposable Supabase
        if: always()
        run: |
          set +e
          supabase stop --no-backup
          rm -f supabase/config.toml supabase/.gitignore "$RUNNER_TEMP/rebanhosync-supabase.env"
          cli_state="$RUNNER_TEMP/rebanhosync-supabase-cli-latest"
          if [[ -f "$cli_state" ]]; then
            cp "$cli_state" supabase/.temp/cli-latest
          fi
          rm -f "$cli_state"

      - name: Detect changed files
        run: |
          set -euo pipefail

          BASE_SHA="${{ github.event.pull_request.base.sha || '' }}"
          HEAD_SHA="${{ github.event.pull_request.head.sha || github.sha }}"

          if [[ -n "$BASE_SHA" ]]; then
            git diff --name-only "$BASE_SHA...$HEAD_SHA" > /tmp/changed-files.txt
          else
            git diff --name-only HEAD~1...HEAD > /tmp/changed-files.txt || true
          fi

          echo "Changed files:"
          sed 's/^/changed: /' /tmp/changed-files.txt

      - name: Active document gates
        run: pnpm run gates:docs
      - name: Repository must remain clean
        run: |
          set -euo pipefail

          echo "Git status:"
          git status -sb

          if [[ -n "$(git status --porcelain=v1)" ]]; then
            echo "Repository is dirty after validation. Generated or modified files must be committed." >&2
            git status --porcelain=v1
            exit 1
          fi
