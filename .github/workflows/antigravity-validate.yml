name: antigravity-validate

on:
  pull_request:
    branches: ["main"]
  merge_group:
    types: [checks_requested]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: antigravity-validate-${{ github.event.pull_request.number || (github.event_name == 'merge_group' && github.sha) || github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

env:
  CI: true
  SUPABASE_INTERNAL_IMAGE_REGISTRY: docker.io

  # JavaScript actions usam Node 24.
  # O runtime do projeto continua controlado por actions/setup-node.
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

  # O mapa dinamico preserva variaveis opcionais sem exigir cadastro no editor.
  VITE_SUPABASE_URL: ${{ fromJSON(toJSON(vars)).CI_SUPABASE_URL || 'https://example.supabase.co' }}
  VITE_SUPABASE_PUBLISHABLE_KEY: ${{ fromJSON(toJSON(vars)).CI_SUPABASE_PUBLISHABLE_KEY || fromJSON(toJSON(vars)).CI_SUPABASE_ANON_KEY || 'example-publishable-key' }}
  VITE_SUPABASE_FUNCTIONS_URL: ${{ fromJSON(toJSON(vars)).CI_SUPABASE_FUNCTIONS_URL || 'https://example.supabase.co/functions/v1' }}

jobs:
  validate:
    name: Required validation
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      # -----------------------------------------------------------------------
      # Checkout
      # -----------------------------------------------------------------------

      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false

      # -----------------------------------------------------------------------
      # 1. Classificação de risco
      #
      # Usa o Node já disponível no runner.
      # Nenhum setup do projeto é necessário para classificar o PR.
      # -----------------------------------------------------------------------

      - name: Detect validation scope
        id: scope
        run: |
          set -euo pipefail

          : > /tmp/pr-files.txt
          : > /tmp/delta-files.txt

          pr_known=false
          delta_known=false
          final_gate=false

          if [[ "$GITHUB_EVENT_NAME" == "merge_group" || "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
            final_gate=true

          elif [[ "$GITHUB_EVENT_NAME" == "pull_request" ]]; then
            event_action="$(jq -r '.action // empty' "$GITHUB_EVENT_PATH")"
            base_sha="$(jq -r '.pull_request.base.sha // empty' "$GITHUB_EVENT_PATH")"
            head_sha="$(jq -r '.pull_request.head.sha // empty' "$GITHUB_EVENT_PATH")"

            if [[ -n "$base_sha" && -n "$head_sha" ]] &&
               git cat-file -e "${base_sha}^{commit}" 2>/dev/null &&
               git cat-file -e "${head_sha}^{commit}" 2>/dev/null; then
              git diff --name-only "$base_sha...$head_sha" > /tmp/pr-files.txt
              pr_known=true
            fi

            if [[ "$event_action" == "synchronize" ]]; then
              before_sha="$(jq -r '.before // empty' "$GITHUB_EVENT_PATH")"
              after_sha="$(jq -r '.after // empty' "$GITHUB_EVENT_PATH")"

              if [[ -n "$before_sha" && -n "$after_sha" && "$after_sha" == "$head_sha" ]] &&
                 git cat-file -e "${before_sha}^{commit}" 2>/dev/null &&
                 git cat-file -e "${after_sha}^{commit}" 2>/dev/null; then
                git diff --name-only "$before_sha" "$after_sha" > /tmp/delta-files.txt
                delta_known=true
              fi
            fi
          fi

          node scripts/ci/classify-validation-scope.mjs classify \
            --pr-files /tmp/pr-files.txt \
            --pr-known "$pr_known" \
            --delta-files /tmp/delta-files.txt \
            --delta-known "$delta_known" \
            --final-gate "$final_gate" |
            tee -a "$GITHUB_OUTPUT"

          echo
          echo "PR files:"
          sed 's/^/pr: /' /tmp/pr-files.txt

          echo
          echo "Delta files:"
          sed 's/^/delta: /' /tmp/delta-files.txt

      # -----------------------------------------------------------------------
      # 2. Fast path DOCS
      #
      # PR exclusivamente documental NÃO precisa:
      # - pnpm
      # - setup-node do projeto
      # - node_modules
      # - lint
      # - Vitest
      # - build
      # - Supabase
      #
      # Tudo abaixo deste bloco pesado é condicional.
      # -----------------------------------------------------------------------

      # -----------------------------------------------------------------------
      # 3. Bootstrap do projeto
      # -----------------------------------------------------------------------

      - name: Setup pnpm
        if: steps.scope.outputs.pr_scope != 'DOCS'
        uses: pnpm/setup@v2
        with:
          install: false

      - name: Setup Node.js
        if: steps.scope.outputs.pr_scope != 'DOCS'
        uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        if: steps.scope.outputs.pr_scope != 'DOCS'
        run: pnpm install --frozen-lockfile --prefer-offline

      # Testa o próprio mecanismo de classificação somente quando o PR
      # não é puramente documental.
      #
      # Alterações em scripts/ci/** ou no próprio workflow deixam de ser DOCS,
      # portanto continuam cobertas.
      - name: Validation scope classifier tests
        if: steps.scope.outputs.pr_scope != 'DOCS'
        run: node --test scripts/ci/classify-validation-scope.node-test.mjs

      - name: Lint
        if: steps.scope.outputs.needs_app == 'true'
        run: pnpm run lint

      - name: Fallow audit
        if: steps.scope.outputs.needs_app == 'true'
        run: pnpm exec fallow audit --gate new-only

      - name: Build
        if: steps.scope.outputs.needs_build == 'true'
        # This artifact checks compilation only; it cannot target a live backend.
        env:
          VITE_BACKEND_ENV: ci-synthetic
          VITE_SUPABASE_URL: https://example.supabase.co
          VITE_SUPABASE_FUNCTIONS_URL: https://example.supabase.co/functions/v1
          VITE_SUPABASE_PUBLISHABLE_KEY: example-publishable-key
        run: pnpm run build

      # -----------------------------------------------------------------------
      # 4. Supabase — somente alto risco
      # -----------------------------------------------------------------------

      - name: Setup Supabase CLI
        if: steps.scope.outputs.needs_supabase == 'true'
        uses: supabase/setup-cli@v3
        with:
          version: 2.72.7

      - name: Preload verified Supabase images
        if: steps.scope.outputs.needs_supabase == 'true'
        run: |
          set -euo pipefail

          # CLI 2.72.7, linux/amd64; preserve its original image names and tags.
          while read -r image digest; do
            docker pull --platform linux/amd64 "${image}@${digest}"
            docker tag "${image}@${digest}" "$image"
          done <<'IMAGES'
          supabase/postgres:17.6.1.071 sha256:a7b77866e1d15726fb56420c1fb6d63a3f93b9b4c6e75021d41042a72da97124
          library/kong:2.8.1 sha256:e21b0b793879ab96720ed4188f9441260273f4bf775bcbff8d435e019ffb759a
          axllent/mailpit:v1.22.3 sha256:168f762c218e167ba88ae7e48194126eb5ba5e99ef652063e3f14f9c4f0ee70f
          postgrest/postgrest:v14.3 sha256:7924f769d8b3b173b93711c90d2fc4164667cffc563551d6a13bc5c93aca2487
          supabase/postgres-meta:v0.95.2 sha256:7a211765a9fe89ee94103441953472af868a9443892e8fb126077cf5cc96b87f
          supabase/studio:2026.01.12-sha-4e9b718 sha256:d585bc004bf478800a98076fb3125d7f0ba56fcd006d88a40de09493049b20d1
          darthsim/imgproxy:v3.8.0 sha256:e1a8f4b99dd65b374b5705550505ace929b9dac98694614bbab3510f9e5107dd
          supabase/edge-runtime:v1.70.0 sha256:c99b95e51da6f8b1a3c27e20ab3a685e36f13ef405a4111ff2ae2461e6e522b2
          timberio/vector:0.28.1-alpine sha256:6d09a70bc65f8d6a71313aee54a90ed7eeb64bbc5ce83d9b4214f24090ab35a1
          supabase/gotrue:v2.185.0 sha256:85b4575908b0cb6fa27f0e9a355cf499e98f6c8915f8e17befbd7299bf2b2aab
          supabase/realtime:v2.69.2 sha256:bc603d95c6c14c01623a6205fe3fb9021b81139dce35764e40793eb42052d01b
          supabase/storage-api:v1.33.5 sha256:29e18f2d37a875895e438ab1e147dd6e30c67e4cb66cf036f38e0208a07cae13
          supabase/logflare:1.28.0 sha256:f190a72b1b734d8ef352853ec89e86b5161d4d3d53ec43f1d715b4313998c730
          IMAGES

      - name: Start disposable Supabase
        if: steps.scope.outputs.needs_supabase == 'true'
        run: |
          set -euo pipefail

          cli_state="$RUNNER_TEMP/rebanhosync-supabase-cli-latest"

          if [[ -f supabase/.temp/cli-latest ]]; then
            cp supabase/.temp/cli-latest "$cli_state"
          else
            rm -f "$cli_state"
          fi

          supabase init --force

          cat >> supabase/config.toml <<'EOF'
          [functions.sync-batch]
          verify_jwt = false
          EOF

          supabase start
          supabase db reset --yes

      - name: Export local Supabase test environment
        if: steps.scope.outputs.needs_supabase == 'true'
        run: |
          set -euo pipefail

          env_file="$RUNNER_TEMP/rebanhosync-supabase.env"

          supabase status -o env > "$env_file"

          set -a
          source "$env_file"
          set +a

          {
            echo "REBANHOSYNC_TEST_DB_URL=$DB_URL"
            echo "REBANHOSYNC_TEST_API_URL=$API_URL"
            echo "REBANHOSYNC_TEST_ANON_KEY=$ANON_KEY"
            echo "REBANHOSYNC_TEST_SERVICE_ROLE_KEY=$SERVICE_ROLE_KEY"
          } >> "$GITHUB_ENV"

      - name: Prepare commercial concurrency fixture
        if: steps.scope.outputs.needs_supabase == 'true'
        run: node scripts/ci/prepare-commercial-concurrency-fixture.mjs

      # -----------------------------------------------------------------------
      # 5. Aplicação
      # -----------------------------------------------------------------------

      - name: Install Chromium for owned IndexedDB cleanup test
        if: steps.scope.outputs.needs_app == 'true'
        run: pnpm exec playwright install --with-deps chromium

      - name: Test
        if: steps.scope.outputs.needs_app == 'true'
        timeout-minutes: 20
        run: |
          set -euo pipefail

          vitest_args=(--bail=1 --reporter=verbose)

          if [[ "${{ steps.scope.outputs.run_global_tests }}" == "true" ]]; then
            echo "Running global Vitest suite."
            pnpm exec vitest run "${vitest_args[@]}"
          else
            test_source="/tmp/delta-files.txt"

            if [[ "${{ steps.scope.outputs.delta_scope }}" == "UNKNOWN" ]]; then
              test_source="/tmp/pr-files.txt"
            fi

            echo "Selecting incremental tests from: $test_source"

            mapfile -t test_targets < <(
              node scripts/ci/classify-validation-scope.mjs \
                test-targets "$test_source"
            )

            if (( ${#test_targets[@]} == 0 )); then
              echo "No safe incremental test target found; running global suite."
              pnpm exec vitest run "${vitest_args[@]}"
            else
              printf 'Incremental test target: %s\n' "${test_targets[@]}"
              pnpm exec vitest run \
                "${test_targets[@]}" \
                "${vitest_args[@]}"
            fi
          fi

      # -----------------------------------------------------------------------
      # 6. Cleanup Supabase
      # -----------------------------------------------------------------------

      - name: Stop disposable Supabase
        if: always() && steps.scope.outputs.needs_supabase == 'true'
        run: |
          set +e

          supabase stop --no-backup
          rm -f "$RUNNER_TEMP/rebanhosync-supabase.env"

          git restore --source=HEAD --worktree -- \
            supabase/config.toml \
            supabase/.gitignore

          cli_state="$RUNNER_TEMP/rebanhosync-supabase-cli-latest"

          if [[ -f "$cli_state" ]]; then
            cp "$cli_state" supabase/.temp/cli-latest
          fi

          rm -f "$cli_state"

      # -----------------------------------------------------------------------
      # 7. Gates universais
      # -----------------------------------------------------------------------

      # Valida o diff que pertence de fato ao PR.
      - name: Diff integrity
        if: always()
        run: |
          set -euo pipefail

          case "$GITHUB_EVENT_NAME" in
            pull_request)
              base_sha="$(jq -r '.pull_request.base.sha // empty' "$GITHUB_EVENT_PATH")"
              head_sha="$(jq -r '.pull_request.head.sha // empty' "$GITHUB_EVENT_PATH")"
              ;;
            merge_group)
              base_sha="$(jq -r '.merge_group.base_sha // empty' "$GITHUB_EVENT_PATH")"
              head_sha="$(jq -r '.merge_group.head_sha // empty' "$GITHUB_EVENT_PATH")"
              ;;
            workflow_dispatch)
              # Sem base de PR: audita o delta do commit selecionado pelo evento.
              head_sha="${GITHUB_SHA:?Missing workflow_dispatch commit}"
              git cat-file -e "${head_sha}^{commit}"
              base_sha="$(git rev-parse --verify "${head_sha}^" 2>/dev/null || git hash-object -t tree /dev/null)"
              git -c core.whitespace=cr-at-eol diff --check "$base_sha" "$head_sha"
              exit 0
              ;;
            *)
              echo "Unsupported event for diff integrity: $GITHUB_EVENT_NAME" >&2
              exit 1
              ;;
          esac

          if [[ -z "$base_sha" || -z "$head_sha" ]]; then
            echo "Unable to resolve event diff for git diff --check." >&2
            exit 1
          fi
          git cat-file -e "${base_sha}^{commit}"
          git cat-file -e "${head_sha}^{commit}"
          # Accept CRLF terminators; spaces/tabs at line ends remain errors.
          git -c core.whitespace=cr-at-eol diff --check "$base_sha...$head_sha"

      # Chamada direta ao gate documental.
      # Não exige pnpm nem instalação das dependências do projeto.
      - name: Active document gates
        if: always()
        run: bash scripts/antigravity/docs_gates.sh

      # -----------------------------------------------------------------------
      # 8. Resumo
      # -----------------------------------------------------------------------

      - name: Validation summary
        if: always()
        run: |
          echo "Validation scope"
          echo "----------------"
          echo "pr_scope=${{ steps.scope.outputs.pr_scope }}"
          echo "delta_scope=${{ steps.scope.outputs.delta_scope }}"
          echo "needs_app=${{ steps.scope.outputs.needs_app }}"
          echo "needs_supabase=${{ steps.scope.outputs.needs_supabase }}"
          echo "needs_build=${{ steps.scope.outputs.needs_build }}"
          echo "run_global_tests=${{ steps.scope.outputs.run_global_tests }}"
          echo "full_final_required=${{ steps.scope.outputs.full_final_required }}"
          echo "final_gate=${{ steps.scope.outputs.final_gate }}"

      # -----------------------------------------------------------------------
      # 9. Garantia de não mutação
      # -----------------------------------------------------------------------

      - name: Repository must remain clean
        if: always()
        run: |
          set -euo pipefail

          echo "Git status:"
          git status -sb

          if [[ -n "$(git status --porcelain=v1)" ]]; then
            echo "Repository is dirty after validation." >&2
            echo "Generated or modified files must be committed or explicitly restored." >&2
            git status --porcelain=v1
            exit 1
          fi
