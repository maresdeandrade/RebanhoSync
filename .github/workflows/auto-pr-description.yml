# Legacy path and check identity retained to avoid breaking external references.
# This workflow no longer generates or mutates PR descriptions; it only validates them.
name: Auto-fill PR description

on:
  pull_request:
    types: [opened, edited, synchronize, reopened, ready_for_review]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: auto-pr-description-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  fill-description:
    # Legacy job name retained intentionally; behavior is validation-only.
    name: Fill PR description
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.draft == false
    runs-on: ubuntu-24.04
    timeout-minutes: 5

    steps:
      - name: Checkout target template
        uses: actions/checkout@v6
        with:
          fetch-depth: 1
          ref: ${{ github.event.pull_request.base.sha }}
          persist-credentials: false

      - name: Validate PR description
        shell: bash
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          set -euo pipefail

          body="${PR_BODY//$'\r'/}"
          failed=false

          fail() {
            echo "::error::$1"
            failed=true
          }

          if [[ -z "${body//[[:space:]]/}" ]]; then
            fail "PR description is empty. Generate the final body with prepare-pr after a READY verification gate."
          fi

          template=".github/pull_request_template.md"
          if [[ ! -f "$template" ]]; then
            fail "Canonical PR template not found at $template."
          else
            mapfile -t required_headings < <(grep -E '^##[[:space:]]+' "$template" || true)

            if (( ${#required_headings[@]} == 0 )); then
              fail "Canonical PR template contains no level-2 sections to validate."
            else
              for heading in "${required_headings[@]}"; do
                if ! grep -Fqx "$heading" <<< "$body"; then
                  fail "Missing required PR section: $heading"
                fi
              done
            fi
          fi

          placeholders=(
            "Descreva o delta real do PR"
            "<capability_id | infra.*>"
            "closes #<id>"
            "path/do/arquivo.ts"
          )

          for placeholder in "${placeholders[@]}"; do
            if grep -Fq "$placeholder" <<< "$body"; then
              fail "Unresolved PR template placeholder: $placeholder"
            fi
          done

          summary="$(
            awk '
              /^## Resumo[[:space:]]*$/ { in_summary=1; next }
              /^##[[:space:]]+/ && in_summary { exit }
              in_summary { print }
            ' <<< "$body" |
              sed -E '/^[[:space:]]*<!--[[:space:]]*/,/-->[[:space:]]*$/d' |
              sed -E 's/^[[:space:]]*-[[:space:]]*$//'
          )"

          if ! grep -Eq '[[:alnum:]]' <<< "$summary"; then
            fail "PR summary has no substantive content."
          fi

          if ! grep -Eq '^[[:space:]]*-[[:space:]]*\[[xX]\][[:space:]]+' <<< "$body"; then
            fail "PR description has no checked scope/type item."
          fi

          if [[ "$failed" == "true" ]]; then
            exit 1
          fi

          echo "PR description structure is valid."
          echo "This check validates structure/placeholders only; it does not certify semantic correctness or replace the verification gate."
