name: Capability / Infra Gap
description: Registrar gap rastreável de capability, infraestrutura, segurança, arquitetura ou governança
title: "[GAP] "
labels: ["capability"]
body:
  - type: markdown
    attributes:
      value: |
        Use este formulário para registrar um gap com evidência suficiente para posterior priorização e implementação.

        Regras:
        - A issue registra diagnóstico/backlog; não autoriza implementação, migration, deploy, merge ou operação remota.
        - Use `capability_id` quando existir identificador ativo aplicável; use `infra.*` para infraestrutura/governança fora do catálogo funcional.
        - Código e migrations ativas têm precedência factual. Documentação e relato de agente não comprovam comportamento isoladamente.
        - Diferencie fato confirmado de inferência.
        - Critério de aceite deve ser verificável e não prescrever refatoração maior que o necessário.
        - Validação esperada deve ser proporcional ao risco e ao escopo.

  - type: input
    id: capability_id
    attributes:
      label: capability_id ou infra_id
      description: Informe o identificador existente quando conhecido. Não crie um novo ID apenas para preencher este campo; use N/A se ainda não houver identificação canônica.
      placeholder: "ex.: sanitario.registro, movimentacao.registro, infra.rls_hardening ou N/A"
    validations:
      required: true

  - type: dropdown
    id: track
    attributes:
      label: Track
      description: Classifique sem transformar roadmap em pendência técnica.
      options:
        - Catalog
        - Infra / Out-of-catalog
        - Ainda não classificado
    validations:
      required: true

  - type: dropdown
    id: severity
    attributes:
      label: Severidade técnica
      description: Classifique pelo impacto observado, não pela urgência desejada.
      options:
        - BLOCKER — segurança, perda/corrupção de dados, isolamento multi-tenant, operação destrutiva ou contrato crítico quebrado
        - HIGH — bug funcional provável ou regressão relevante sem mitigação adequada
        - MEDIUM — falha real de robustez, edge case relevante ou cobertura insuficiente com impacto limitado
        - LOW — problema menor e objetivo, sem risco crítico
    validations:
      required: true

  - type: dropdown
    id: domain
    attributes:
      label: Domínio principal
      options:
        - animais
        - sanitario
        - biosseguranca
        - pesagem
        - nutricao
        - movimentacao
        - lotes_pastos
        - reproducao
        - compra_venda
        - estoque_insumos
        - financeiro
        - agenda
        - insights
        - sync
        - auth
        - security
        - platform
        - mobile
        - docs
        - ci_governanca
        - outro
    validations:
      required: true

  - type: checkboxes
    id: affected_layers
    attributes:
      label: Camadas afetadas
      description: Marque somente superfícies sustentadas pela evidência disponível.
      options:
        - label: UI / UX
        - label: Domínio / regra de negócio
        - label: Dexie / offline local
        - label: Supabase / SQL / migrations
        - label: RLS / RPC / Edge Functions
        - label: Sync / queue / retry / replay / reconciliação
        - label: Auth / sessão / ownership
        - label: Testes
        - label: Documentação
        - label: CI / governança

  - type: checkboxes
    id: contracts
    attributes:
      label: Contratos potencialmente afetados
      description: Marque apenas quando o gap realmente tocar o contrato.
      options:
        - label: Agenda — intenção/tarefa futura
        - label: Eventos — fato executado/histórico
        - label: state_* — estado atual/read model
        - label: Protocolo — regra/configuração
        - label: RLS / multi-tenant / fazenda_id
        - label: Offline-first / sync / idempotência
        - label: Fonte de verdade
        - label: Nenhum dos contratos acima

  - type: textarea
    id: current_behavior
    attributes:
      label: Comportamento atual confirmado
      description: Descreva somente o comportamento observado. Não proponha solução neste campo.
      placeholder: |
        FATO CONFIRMADO:
        - cenário observado
        - resultado atual
        - condição em que ocorre
    validations:
      required: true

  - type: textarea
    id: evidence
    attributes:
      label: Evidência confirmada — PM / P
      description: Inclua paths/trechos, comandos/resultados, logs não sensíveis ou passos reproduzíveis. Não use relatório de agente como única prova.
      placeholder: |
        PM: caminho/arquivo.ts:trecho — o que o código comprova
        P: comando executado → resultado observado
    validations:
      required: true

  - type: textarea
    id: inference
    attributes:
      label: Inferências / hipóteses ainda não comprovadas
      description: Registre separadamente o que ainda precisa ser validado. Use N/A se não houver.
      placeholder: |
        INFERÊNCIA:
        - hipótese
        - evidência que ainda falta
    validations:
      required: true

  - type: textarea
    id: expected_behavior
    attributes:
      label: Comportamento esperado
      description: Descreva o resultado correto sem prescrever implementação específica quando ela ainda não estiver determinada.
      placeholder: |
        O fluxo deve preservar <contrato> e produzir <resultado observável> sob <condição>.
    validations:
      required: true

  - type: textarea
    id: impact
    attributes:
      label: Risco / impacto
      description: Explique mecanismo, cenário e impacto operacional, técnico, de segurança, dados ou UX.
      placeholder: |
        - mecanismo da falha
        - cenário concreto
        - impacto
        - alcance conhecido
    validations:
      required: true

  - type: textarea
    id: proposed_scope
    attributes:
      label: Escopo sugerido
      description: Direção mínima e reversível, sem autorizar implementação. Liste também exclusões importantes.
      placeholder: |
        Incluir:
        - menor superfície necessária para corrigir/provar o gap
        - testes diretamente relacionados

        Não incluir:
        - refatoração transversal não necessária
        - migration/RLS/sync sem necessidade comprovada
    validations:
      required: false

  - type: textarea
    id: acceptance
    attributes:
      label: Critérios de aceite verificáveis
      description: Critérios observáveis para considerar o gap resolvido. Não dependem de declaração de agente.
      placeholder: |
        - comportamento incorreto não é mais reproduzível
        - contrato afetado permanece preservado
        - teste focal cobre o cenário
        - documentação ativa é reconciliada somente se houver delta real
    validations:
      required: true

  - type: textarea
    id: validation_plan
    attributes:
      label: Validação proporcional esperada
      description: Liste validações diretamente relacionadas. Não peça regressão global, build ou E2E por rotina sem justificativa.
      placeholder: |
        - teste(s) focal(is): <arquivo/comando conhecido>
        - lint/build somente se o escopo justificar
        - gate específico de docs/agentes somente quando aplicável
    validations:
      required: true

  - type: checkboxes
    id: docs_impact
    attributes:
      label: Documentação ativa potencialmente afetada
      description: Marque somente documentos vivos que possam precisar de reconciliação após mudança real.
      options:
        - label: docs/context/PROJECT_STATUS.md
        - label: docs/review/ACTIVE_PHASE_PLAN.md
        - label: docs/review/CURRENT_PHASE_HANDOFF.md
        - label: docs/product/CAPABILITY_MAP.md
        - label: docs/product/ROADMAP.md
        - label: docs/context/SOURCE_OF_TRUTH.md
        - label: Outro documento ativo
        - label: Nenhuma atualização documental esperada

  - type: textarea
    id: depends_on
    attributes:
      label: Dependências / bloqueadores
      description: IDs, issues, contratos ou evidências que precisam existir antes da implementação. Use N/A quando não houver.
      placeholder: |
        - issue/capability/infra relacionada
        - decisão ou evidência ainda pendente
    validations:
      required: false

  - type: textarea
    id: recovery
    attributes:
      label: Recuperação / mitigação
      description: Não presuma rollback. Quando relevante, indique rollback, compensação, reconciliação ou convergência idempotente compatível com o contrato real.
      placeholder: |
        - estratégia de mitigação
        - condição de reversão, se realmente suportada
        - reconciliação/compensação necessária em falha parcial
    validations:
      required: false
